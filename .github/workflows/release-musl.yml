name: release-musl

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-musl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build musl release
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Prepare assets
        run: |
          cp target/x86_64-unknown-linux-musl/release/anytls anytls-x86_64-unknown-linux-musl
          sha256sum anytls-x86_64-unknown-linux-musl > anytls-x86_64-unknown-linux-musl.sha256

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            anytls-x86_64-unknown-linux-musl
            anytls-x86_64-unknown-linux-musl.sha256
            anyreality.yaml
            deploy/systemd/anytls-anyreality.service
