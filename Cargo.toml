[package]
name = "anytls"
version = "0.1.0"
edition = "2024"

[lib]
name = "anytls"
path = "src/lib.rs"

[[bin]]
name = "anytls"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
rand = "0.8"
rcgen = "0.13"
rustls = "0.23"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
