[package]
name = "anytls"
version = "0.1.0"
edition = "2024"

[lib]
name = "anytls"
path = "src/lib.rs"

[[bin]]
name = "anytls"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
lru = "0.12"
md-5 = "0.10"
once_cell = "1.21"
rand = "0.8"
rcgen = "0.13"
rcgen12 = { package = "rcgen", version = "0.12.1" }
ring = "0.17"
rustls = "0.22"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }

[patch.crates-io]
rustls = { path = "./vendor/rustls-reality/rustls" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
